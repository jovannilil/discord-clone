<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Voxoria Chat</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #313338;
        color: #dbdee1;
        font-family: "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      p { color: #949ba4; font-size: 14px; }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 20px;
        border-radius: 4px;
        background: #0f766e;
        color: white;
        text-decoration: none;
        font-weight: 500;
      }
      a:hover { background: #4752c4; }
    </style>
  </head>
  <body>
    <div>
      <h2>Can't reach the server</h2>
      <p>Check your internet connection, then try again.</p>
      <a href="app://retry">Try again</a>
    </div>
  </body>
</html>
