# Builds the desktop app for Windows and Linux whenever desktop/ changes,
# and attaches the installers to the GitHub Release "desktop-v<version>".
# The website's Download button points at .../releases/latest/download/<file>.
name: Desktop app

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            files: |
              desktop/dist/Voxoria-Chat-Setup.exe
          - os: ubuntu-latest
            args: --linux AppImage deb tar.gz
            files: |
              desktop/dist/Voxoria-Chat.AppImage
              desktop/dist/Voxoria-Chat-linux.deb
              desktop/dist/Voxoria-Chat-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: Desktop app ${{ steps.version.outputs.version }}
          body: |
            Desktop app for Voxoria Chat.
            - Windows: Voxoria-Chat-Setup.exe
            - Ubuntu / Debian / Mint: Voxoria-Chat-linux.deb
            - Other Linux: Voxoria-Chat.AppImage (or Voxoria-Chat-linux.tar.gz)
          make_latest: true
          files: ${{ matrix.files }}
